[package]
name = "axiom-oracle"
version = "0.1.0"
edition = "2021"
description = "AXIOM Fractal Oracle agent: a sandboxed Wasm module that computes Mandelbrot escape-time dynamics (z=z^2+c) over the same MCP-style ABI as the leaf agent. Bounded orbits = robust strategy islands; escape times = fragility. Zero dependencies."

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
